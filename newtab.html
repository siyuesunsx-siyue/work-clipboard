<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>临泊站</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar" aria-label="临泊站概览">
        <div class="brand">
          <img class="brand-mark" src="icons/icon-128.png" alt="">
          <div>
            <h1>临泊站</h1>
            <p id="todayLabel">今日临泊</p>
          </div>
        </div>

        <section class="stats" aria-label="统计">
          <div>
            <strong id="totalCount">0</strong>
            <span>全部</span>
          </div>
          <div>
            <strong id="fileCount">0</strong>
            <span>文件</span>
          </div>
          <div>
            <strong id="stashCount">0</strong>
            <span>暂存</span>
          </div>
        </section>

        <div id="companionStatus" class="companion-status">仅浏览器内捕获</div>

        <nav class="filters" aria-label="筛选">
          <button class="filter is-active" data-filter="active">今日车位</button>
          <button class="filter" data-filter="stashed">暂存</button>
          <button class="filter" data-filter="all">全部</button>
          <button class="filter" data-filter="cleanup">清场</button>
        </nav>

        <button id="cleanupButton" class="primary-action" type="button">下班清场</button>
      </aside>

      <section class="workspace">
        <header class="toolbar">
          <div class="search-wrap">
            <input id="searchInput" type="search" placeholder="搜索文本、文件名、标签" autocomplete="off">
          </div>
          <div class="toolbar-actions">
            <input id="fileInput" type="file" multiple hidden>
            <button id="fileButton" type="button">添加文件</button>
            <button id="pasteButton" type="button">读取剪贴板</button>
          </div>
        </header>

        <section id="dropZone" class="capture-zone" tabindex="0">
          <textarea id="textInput" placeholder="把临时要停放的文本、图片或文件放在这里。按 Ctrl+Enter 入位。" rows="5"></textarea>
          <div class="capture-actions">
            <input id="tagInput" type="text" placeholder="用途标签，例如 稍后看, 要发送, 素材">
            <button id="saveTextButton" type="button">停放文本</button>
          </div>
        </section>

        <section class="list-head">
          <div>
            <h2 id="viewTitle">今日临泊内容</h2>
            <p id="viewHint">每条内容会尽量显示来源和处理建议。</p>
          </div>
          <button id="exportVisibleButton" type="button">导出当前列表</button>
        </section>

        <section id="itemsList" class="items" aria-live="polite"></section>
      </section>
    </main>

    <template id="itemTemplate">
      <article class="item">
        <div class="item-main">
          <div class="item-topline">
            <span class="item-kind"></span>
            <time class="item-time"></time>
          </div>
          <h3 class="item-title"></h3>
          <p class="item-preview"></p>
          <p class="item-context"></p>
          <div class="item-advice"></div>
          <div class="item-tags"></div>
          <div class="quick-tags" aria-label="快速用途标签"></div>
        </div>
        <div class="item-actions">
          <button class="copy-action" type="button">复制</button>
          <button class="download-action" type="button">保存到本地</button>
          <button class="stash-action" type="button">暂存</button>
          <button class="delete-action danger" type="button">删除</button>
        </div>
      </article>
    </template>

    <div id="confirmModal" class="modal" hidden>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <h2 id="confirmTitle">确认清出这个临泊位？</h2>
        <p id="confirmText">清出后，这条内容会从临泊站删除。</p>
        <div class="modal-actions">
          <button id="cancelDeleteButton" type="button">再停一会儿</button>
          <button id="confirmDeleteButton" class="danger-action" type="button">清出车位</button>
        </div>
      </div>
    </div>

    <div id="celebrationLayer" class="celebration-layer" aria-hidden="true"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="newtab.js"></script>
  </body>
</html>
